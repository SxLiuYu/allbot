name: Publish release (npm + tarball)

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    # 包名是 scoped 的 `@sxliuyu/allbot`（裸 `allbot` 在 npm 上属于 2015 年的
    # 另一个项目，所以不能直接用）。发布需要一种 npm 凭证：
    #   - `NPM_TOKEN` secret（最省事，一次性生成）
    #   - OIDC trusted publishing（要在 npmjs.com 网页上登录 npm 账号 + 2FA 注册）
    # 两者都没有时这一步必然 ENEEDAUTH，所以用仓库变量 PUBLISH_NPM 显式开关；
    # 关掉也不影响发版——GitHub Release 与 tarball 照常产出。
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing (OIDC) needs npm >= 11.5.1. A bare "24" resolves to
      # the latest 24.x (>= 24.5.0, which bundles npm 11.5.1+). An older npm
      # silently falls back to token auth and fails with misleading ENEEDAUTH.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify npm >= 11.5.1
        run: |
          V=$(npm --version)
          N=$(echo "$V" | cut -d. -f1-2 | tr -d '.')
          [ "$N" -ge 115 ] || { echo "npm $V < 11.5.1: trusted publishing unsupported"; exit 1; }
          echo "npm $V OK"

      - name: Install pnpm
        # Pin to the packageManager version: a newer global pnpm self-switches to the
        # managed @pnpm/exe native binary, whose npm_execpath then breaks build-all's
        # pnpm runner (node executes the ELF as JS -> SyntaxError). --allow-scripts
        # because npm 11 blocks pnpm's install scripts by default.
        run: npm install -g pnpm@10.32.1 --allow-scripts=pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Same-date "-N" versions look like semver prereleases to npm 11+, which
      # refuses to publish them without an explicit dist-tag. They are real
      # releases in our scheme, so pin them to latest (matches npm 10 behavior).
      #
      # 两种鉴权方式，有 token 就优先用它：
      # - `NPM_TOKEN` secret（Granular access token，勾 Automation 或 Publish）
      # - OIDC trusted publishing（需在 npmjs.com 上为该包注册 trusted publisher）
      # token 更容易先跑通：注册 trusted publisher 要在网页上登录 npm 账号并过
      # 2FA，而 token 只是一次性生成。两种都不存在时这一步仍然会失败，
      # 所以 job 的 if 条件同时看 PUBLISH_NPM 变量（显式开关）。
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "auth: NPM_TOKEN secret"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          else
            echo "auth: OIDC trusted publishing（无 NPM_TOKEN secret）"
          fi
          npm publish --access public --ignore-scripts --tag latest

  upload-tarball:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        # Pin to the packageManager version: a newer global pnpm self-switches to the
        # managed @pnpm/exe native binary, whose npm_execpath then breaks build-all's
        # pnpm runner (node executes the ELF as JS -> SyntaxError). --allow-scripts
        # because npm 11 blocks pnpm's install scripts by default.
        run: npm install -g pnpm@10.32.1 --allow-scripts=pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create tarball
        run: npm pack --ignore-scripts

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          # 包名是 scoped 的 `@sxliuyu/allbot`，`npm pack` 产出的文件名是
          # `sxliuyu-allbot-<ver>.tgz`，不是 `allbot-<ver>.tgz`。原来的
          # `TARBALL=$(ls allbot-*.tgz | head -1)` 在改名后拿到空变量，
          # `gh release create` 因缺文件参数失败（v2026.11.15 就是这样挂的）。
          #
          # ⚠️ 不要写成 `ls a-*.tgz b-*.tgz`：只要有任意一个通配符没匹配到，
          # ls 就以 exit 2 结束，`pipefail` + `set -e` 让整步直接失败
          # （v2026.11.16 的 exit code 2 就是这么来的）。用 find 逐条筛选，
          # 没有匹配只返回空、退出码恒为 0。
          TARBALL=$(find . -maxdepth 1 -type f \
            \( -name 'sxliuyu-allbot-*.tgz' -o -name 'allbot-*.tgz' \) \
            -printf '%f\n' | sort | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error title=publish::npm pack 未产出 tarball"
            find . -maxdepth 1 -name '*.tgz' -printf '%f\n' || echo "(no .tgz in workspace)"
            exit 1
          fi
          echo "uploading $TARBALL for $TAG"
          # 手写 notes 优先：仓库里的 commit 没有打 label，`--generate-notes`
          # 只能产出一句 "Full Changelog" 的空壳。约定放
          # `docs/releases/<tag>.md`，存在就整份拿来当 release 正文。
          NOTES_FILE="docs/releases/${TAG}.md"
          NOTES_ARGS=(--generate-notes)
          if [ -f "$NOTES_FILE" ]; then
            echo "using hand-written notes: $NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "no $NOTES_FILE, falling back to --generate-notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" --title "$TAG" "${NOTES_ARGS[@]}"
          fi
