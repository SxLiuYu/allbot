name: Publish release (npm + tarball)

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    # Package is now `@sxliuyu/allbot` (scoped). The bare `allbot` name on npm
    # belongs to an unrelated 2015 project, which is why this used to be off.
    # A scoped publish works, but OIDC trusted publishing still has to be
    # registered for this repo/package on npmjs.com first — until then the job
    # would fail with ENEEDAUTH. Set repo variable PUBLISH_NPM=true after that
    # registration exists; releases ship via GitHub Releases + tarball either way.
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing (OIDC) needs npm >= 11.5.1. A bare "24" resolves to
      # the latest 24.x (>= 24.5.0, which bundles npm 11.5.1+). An older npm
      # silently falls back to token auth and fails with misleading ENEEDAUTH.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify npm >= 11.5.1
        run: |
          V=$(npm --version)
          N=$(echo "$V" | cut -d. -f1-2 | tr -d '.')
          [ "$N" -ge 115 ] || { echo "npm $V < 11.5.1: trusted publishing unsupported"; exit 1; }
          echo "npm $V OK"

      - name: Install pnpm
        # Pin to the packageManager version: a newer global pnpm self-switches to the
        # managed @pnpm/exe native binary, whose npm_execpath then breaks build-all's
        # pnpm runner (node executes the ELF as JS -> SyntaxError). --allow-scripts
        # because npm 11 blocks pnpm's install scripts by default.
        run: npm install -g pnpm@10.32.1 --allow-scripts=pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Same-date "-N" versions look like semver prereleases to npm 11+, which
      # refuses to publish them without an explicit dist-tag. They are real
      # releases in our scheme, so pin them to latest (matches npm 10 behavior).
      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --access public --ignore-scripts --tag latest

  upload-tarball:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        # Pin to the packageManager version: a newer global pnpm self-switches to the
        # managed @pnpm/exe native binary, whose npm_execpath then breaks build-all's
        # pnpm runner (node executes the ELF as JS -> SyntaxError). --allow-scripts
        # because npm 11 blocks pnpm's install scripts by default.
        run: npm install -g pnpm@10.32.1 --allow-scripts=pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create tarball
        run: npm pack --ignore-scripts

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          # 包名是 scoped 的 `@sxliuyu/allbot`，`npm pack` 产出的文件名是
          # `sxliuyu-allbot-<ver>.tgz`，不是 `allbot-<ver>.tgz`。原来按
          # `allbot-*.tgz` 匹配，得到一个空变量，`gh release create` 因缺文件
          # 参数失败（v2026.11.15 就是这样挂的）。同时兼容两种形态，防止以后
          # 又改回非 scoped 包名。
          TARBALL=$(ls -1 sxliuyu-allbot-*.tgz allbot-*.tgz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "::error title=publish::npm pack 未产出 tarball"
            ls -1 *.tgz || echo "(no .tgz in workspace)"
            exit 1
          fi
          echo "uploading $TARBALL for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" --title "$TAG" --generate-notes
          fi
