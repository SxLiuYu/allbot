name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  check:
    name: Check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm plugin-sdk:check-exports
      - run: NODE_OPTIONS=--max-old-space-size=8192 pnpm plugin-sdk:api:check
      - run: node scripts/check-doc-paths.mjs
      - run: pnpm config:docs:check

  test:
    name: Test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rm -rf node_modules/.vite node_modules/.vitest
      - run: pnpm test
        env:
          ALLBOT_BUNDLED_PLUGINS_DIR: ${{ github.workspace }}/extensions

  # ---------------------------------------------------------------------------
  # voice/ = vendored Charlie snapshot（Python/FastAPI）。
  #
  # Runs on 3.12 to match what the snapshot was developed against; 3.13 dropped
  # `audioop`, which `_tts_local_stream` needs for downmix/resample.
  #
  # `libopus0` is not optional: `app/xiaozhi_codec.py` imports opuslib at module
  # scope, so without the shared library every test that touches the xiaozhi WS
  # path fails during collection rather than at assert time.
  # ---------------------------------------------------------------------------
  voice:
    name: Voice
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voice/charlie/requirements*.txt
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libopus0 libopus-dev portaudio19-dev
      - name: Install Python dependencies
        working-directory: voice/charlie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # 语法检查放测试之前：测试红了会跳过后面所有步骤，那连「能不能 import」
      # 这种更基础的问题都看不到。
      - name: Compile check
        working-directory: voice/charlie
        run: python -m compileall -q voice_server.py voice_agent.py local_wake.py presence.py app/ agent/
      - name: Run tests
        id: pytest
        working-directory: voice/charlie
        env:
          # 不联网、不读真实 Key；测试里凡是需要外部服务的都已被 mock。
          ALLBOT_TEST_MODE: "1"
        # continue-on-error + 单独一步判定：这样失败清单能完整落进 Job Summary。
        # 直接用 `run: pytest` 时，红了的 job 只留一句 exit code，看不到是哪些
        # 用例——仓库 API 拿 job 日志还要求 admin 权限。
        continue-on-error: true
        run: |
          set +e
          python -m pytest tests -q --tb=short --junitxml=/tmp/voice-junit.xml 2>&1 | tee /tmp/voice-pytest.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarise failures
        if: always()
        working-directory: voice/charlie
        run: |
          {
            echo "### voice/ pytest"
            if [ -f /tmp/voice-pytest.log ]; then
              grep -E '^(FAILED|ERROR)' /tmp/voice-pytest.log | head -100 || echo "(no FAILED/ERROR lines)"
              echo
              tail -3 /tmp/voice-pytest.log
            else
              echo "(no log captured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Workflow commands land in the check run's `annotations`, which — unlike
      # the job log — is readable through the public API without admin rights.
      # GitHub caps a step at 10 annotations, so: 8 failing tests + 2 summary lines.
      - name: Publish failures as annotations
        if: always()
        working-directory: voice/charlie
        run: |
          if [ ! -f /tmp/voice-pytest.log ]; then
            echo "::error title=voice pytest::no log captured"
            exit 0
          fi
          grep -E '^(FAILED|ERROR)' /tmp/voice-pytest.log | head -8 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-900)
            echo "::error title=voice pytest::${msg}"
          done
          # 汇总行（"N failed, M passed"）给总数，定位优先看它。
          tail -2 /tmp/voice-pytest.log | while IFS= read -r line; do
            [ -z "$line" ] && continue
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-900)
            echo "::error title=voice pytest summary::${msg}"
          done
      - name: Fail if tests failed
        if: steps.pytest.outputs.exit_code != '0'
        run: |
          echo "pytest exited ${{ steps.pytest.outputs.exit_code }}"
          exit 1

  # ---------------------------------------------------------------------------
  # mobile/ = vendored Mika/言出 snapshot（Android/Kotlin）。
  #
  # Two modules: `:core` is a plain kotlin-jvm module (no Android SDK needed),
  # `:app` is the Android application. Both are exercised here so the README's
  # "539 Kotlin tests" claim stays true.
  #
  # `:app` needs the Android SDK: app/build.gradle.kts pins compileSdk = 36,
  # and without a platform installed the Kotlin compile task fails before any
  # test runs. `local.properties` is gitignored, so the SDK path must come from
  # ANDROID_HOME/sdk.dir that the setup action provides.
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Install SDK platform for compileSdk
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      # Split the two modules so a `:app` environment problem doesn't hide
      # `:core` results — `:core` is pure JVM and always runnable.
      # continue-on-error + a summary step for the same reason as voice: the
      # job log needs admin rights to read through the API, the Job Summary
      # does not.
      - name: Unit tests (:core, pure JVM)
        id: core_test
        continue-on-error: true
        working-directory: mobile
        run: |
          set +e
          # 仓库里 gradlew 的 git 模式位若丢了（100644），runner 上会
          # "Permission denied"。这里兜一层，不依赖索引位。
          chmod +x gradlew
          ./gradlew :core:test --stacktrace 2>&1 | tee /tmp/mobile-core.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Unit tests (:app, Android)
        id: app_test
        continue-on-error: true
        working-directory: mobile
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/mobile-app.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarise failures
        if: always()
        run: |
          {
            echo "### mobile/ gradle"
            for f in /tmp/mobile-core.log /tmp/mobile-app.log; do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f")"
              echo '```'
              grep -E 'FAILED|error:|e: |What went wrong' -A3 "$f" | head -60 || tail -20 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Same reason as voice: check-run annotations are readable anonymously,
      # the job log is not.
      - name: Publish failures as annotations
        if: always()
        run: |
          for f in /tmp/mobile-core.log /tmp/mobile-app.log; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # Gradle 的失败原因常在最后几行（BUILD FAILED / What went wrong）。
            # GitHub 每个 step 最多收 10 条 annotation，所以尾部只发 6 行、
            # 关键行发 4 条，避免互相挤掉。
            tail -6 "$f" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-900)
              echo "::error title=${base} tail::${msg}"
            done
            grep -nE 'FAILED|error:|^e: |What went wrong|Execution failed' "$f" | tail -4 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-900)
              echo "::error title=${base} key::${msg}"
            done
          done
      - name: Fail if either module's tests failed
        if: steps.core_test.outputs.exit_code != '0' || steps.app_test.outputs.exit_code != '0'
        run: |
          echo ":core exit=${{ steps.core_test.outputs.exit_code }}"
          echo ":app  exit=${{ steps.app_test.outputs.exit_code }}"
          exit 1
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: |
            mobile/**/build/reports/tests/
            mobile/**/build/test-results/
          retention-days: 7
