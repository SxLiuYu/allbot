services:
  allbot-gateway:
    image: ${ALLBOT_IMAGE:-allbot:local}
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      TERM: xterm-256color
      ALLBOT_GATEWAY_TOKEN: ${ALLBOT_GATEWAY_TOKEN:-}
      ALLBOT_ALLOW_INSECURE_PRIVATE_WS: ${ALLBOT_ALLOW_INSECURE_PRIVATE_WS:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TZ: ${ALLBOT_TZ:-Asia/Shanghai}
    volumes:
      - ${ALLBOT_CONFIG_DIR}:/home/node/.allbot
      - ${ALLBOT_WORKSPACE_DIR}:/home/node/.allbot/workspace
    ports:
      - "${ALLBOT_GATEWAY_PORT:-18789}:18789"
      - "${ALLBOT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${ALLBOT_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
